openapi: 3.0.3
info:
  title: DyHealthNet- OpenAPI 3
  description: |-
    description about DyHealthNet

  license:
    name: GPL3.0
    url: https://github.com/dyhealthnet..
  version: 1.0.0
servers:
  - url: https://localhost:3000
tags:
  - name: default
    description: default
paths:
  /variables:
    get: 
      summary: variables types
      description: different variable types in data
      operationId: getVariables
      responses: 
        "200": 
          description: successful retrieval
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/variables"
                
  /plotData: 
    get: 
      summary: data for plots
      description: data with correct type for plots
      operationId: getData
      parameters: 
        - name: x
          in: query
          required: True
          description: x variable of the plot 
          schema: 
            type: string
            example: age
        - name: y
          in: query
          required: True
          description: y variable of the plot 
          schema: 
            type: string
            example: height
        - name: c
          in: query
          required: False
          description: category for coloring 
          schema: 
            type: string
            example: sex
            
      responses:
        "200":
          description: successful retrieval
          content: 
            application/json: 
              schema: 
                $ref: "#/components/schemas/plotData"

components:
  schemas:
    variables: 
      type: object 
      properties: 
        discrete: 
          type: array
          items: 
            type: string
          example: ["age"]
        continuous:
          type: array
          items:
            type: string
          example: ["height", "bmi"]
        categorical:
          type: array
          items:
            type: string
          example: ["sex"]
    plotData: 
      type: object 
      properties: 
        xVarName:
          type: array
          items: 
            type: string
          example: ["female", "male"]
        yVarName: 
          type: array
          items: 
            type: integer
          example: [18,20,22]
            
            
            
            
            
            
            
            
            
            
            
            
